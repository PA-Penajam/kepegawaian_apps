name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

# Batalkan run lama pada ref yang sama agar tidak menumpuk di runner terbatas.
concurrency:
  group: linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      - name: Prepare Wayfinder Types
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Check Pint
        run: ./vendor/bin/pint --test

      - name: Check Frontend Format
        run: npm run format:check

      - name: Check Frontend Lint
        run: npm run lint:check

      - name: Check TypeScript Types
        run: npm run types:check

name: Deploy Production (Windows Server 2019)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Group khusus kepegawaian-apps agar tidak saling membatalkan dengan deploy
# aplikasi lain (mis. sso-papenajam) yang berjalan di self-hosted runner sama.
concurrency:
  group: production-deploy-kepegawaian
  cancel-in-progress: false

jobs:
  test-pr:
    name: Build & Test Pull Request (Ubuntu)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Run test suite
        run: |
          php artisan config:clear
          ./vendor/bin/pest --fail-on-risky

  test:
    name: Build & Test on Windows Server 2019
    runs-on: [self-hosted, windows, x64]
    if: github.event_name != 'pull_request'
    timeout-minutes: 30

    steps:
      - name: Verify runner operating system
        shell: powershell
        run: |
          $os = Get-CimInstance -ClassName Win32_OperatingSystem

          if ($os.Caption -notmatch 'Windows Server 2019' -or $os.Version -notlike '10.0.17763*') {
              throw "Runner harus menggunakan Windows Server 2019. OS terdeteksi: $($os.Caption) ($($os.Version))."
          }

          Write-Host "Runner tervalidasi: $($os.Caption) ($($os.Version))."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PHP environment
        shell: powershell
        run: |
          php -v
          composer -V
          $exts = @('bcmath', 'intl', 'pdo_sqlite', 'sqlite3', 'fileinfo', 'mbstring', 'gd', 'openssl')
          $loaded = php -m
          foreach ($ext in $exts) {
              if ($loaded -notcontains $ext) {
                  throw "Ekstensi PHP yang dibutuhkan tidak ditemukan: $ext"
              }
          }
          Write-Host "PHP dan ekstensi tervalidasi."

      - name: Verify Node.js environment
        shell: powershell
        run: |
          node -v
          npm -v
          Write-Host "Node.js dan npm tervalidasi."

      - name: Prepare Laravel environment
        shell: powershell
        run: Copy-Item .env.example .env -Force

      - name: Install PHP dependencies
        shell: powershell
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        shell: powershell
        run: php artisan key:generate --force

      - name: Install JavaScript dependencies
        shell: powershell
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        shell: powershell
        run: npm run build

      - name: Run test suite
        shell: powershell
        run: |
          php artisan config:clear
          php artisan test --compact --fail-on-risky

  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, windows, x64]
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 30
    env:
      # Sesuaikan jika path produksi berbeda dari konvensi E:\pa-penajam\...
      DEPLOY_PATH: E:\pa-penajam\kepegawaian-apps

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          path: release

      - name: Backup current production
        shell: powershell
        run: |
          $timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $deployPath = $env:DEPLOY_PATH.TrimEnd('\')
          $backupRoot = Join-Path $deployPath 'storage\backups\releases'
          New-Item -ItemType Directory -Force -Path $backupRoot | Out-Null
          $backupPath = Join-Path $backupRoot $timestamp
          Write-Host "Backup produksi ke: $backupPath"
          # Salin seluruh app (termasuk database SQLite & vendor) dengan /XJ agar junction tidak disalin rekursif.
          # Gunakan full path pada /XD agar hanya folder spesifik yang dikecualikan (bukan resources\js\routes\storage).
          $backupExcludes = @(
              (Join-Path $deployPath 'storage'),
              (Join-Path $deployPath 'public\storage'),
              'node_modules',
              '.git'
          )
          robocopy $deployPath $backupPath /E /XJ /XD $backupExcludes /XF '.env' /R:2 /W:2 /NP /NFL /NDL
          if ($LASTEXITCODE -ge 8) { throw "Backup gagal (robocopy exit code $LASTEXITCODE)." }
          # Robocopy exit 1-7 = sukses (file tersalin); nol-kan agar runner tidak fail.
          $LASTEXITCODE = 0
          Get-ChildItem -Path $backupRoot -Directory | Sort-Object Name -Descending | Select-Object -Skip 5 | Remove-Item -Recurse -Force
          # Simpan path backup agar langkah rollback dapat memulihkannya bila deploy gagal.
          "BACKUP_PATH=$backupPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate production env and enter maintenance mode
        shell: powershell
        run: |
          if (-not (Test-Path "$env:DEPLOY_PATH\.env")) {
              throw "File .env tidak ditemukan di $env:DEPLOY_PATH. Deploy dibatalkan agar konfigurasi produksi tidak tertimpa."
          }

          if (Test-Path "$env:DEPLOY_PATH\vendor") {
              Push-Location $env:DEPLOY_PATH
              try {
                  php artisan down --retry=60
              } finally {
                  Pop-Location
              }
          }

      - name: Sync release to production
        shell: powershell
        run: |
          $source = (Join-Path $PWD 'release').TrimEnd('\')
          $deployPath = $env:DEPLOY_PATH.TrimEnd('\')
          Write-Host "Sync $source ke $deployPath"
          # /MIR + /XJ dengan full path kedua sisi menjaga junction public\storage, storage, vendor, build, dan cache
          # di destination sekaligus tetap menyalin resources\js\routes\storage dari release.
          $syncExcludes = @(
              '.git',
              'node_modules',
              (Join-Path $source 'storage'),
              (Join-Path $deployPath 'storage'),
              (Join-Path $source 'vendor'),
              (Join-Path $deployPath 'vendor'),
              (Join-Path $source 'public\build'),
              (Join-Path $deployPath 'public\build'),
              (Join-Path $source 'bootstrap\cache'),
              (Join-Path $deployPath 'bootstrap\cache'),
              (Join-Path $source 'public\storage'),
              (Join-Path $deployPath 'public\storage')
          )
          robocopy $source $deployPath /MIR /XJ /XD $syncExcludes /XF '.env' 'kepegawaian_db' '*.sqlite' '*.sqlite3' /R:2 /W:2 /NP /NFL /NDL
          if ($LASTEXITCODE -ge 8) { throw "Sync gagal (robocopy exit code $LASTEXITCODE)." }
          # Robocopy exit 1-7 = sukses (file tersalin); nol-kan agar runner tidak fail.
          $LASTEXITCODE = 0

      - name: Install production dependencies
        shell: powershell
        run: |
          Set-Location $env:DEPLOY_PATH
          # Hapus cache PHP lama sebelum composer install memicu @php artisan package:discover.
          Get-ChildItem -Path 'bootstrap\cache' -Filter '*.php' -ErrorAction SilentlyContinue | Remove-Item -Force
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
          # Install lengkap dulu (termasuk vite dkk) agar build bisa jalan,
          # lalu prune devDependencies setelah build selesai.
          npm ci --no-audit --no-fund
          npm run build
          npm prune --omit=dev

      - name: Migrate, link storage, and optimize
        shell: powershell
        run: |
          Set-Location $env:DEPLOY_PATH
          if (-not (Test-Path '.env')) { throw "File .env tidak ditemukan di $env:DEPLOY_PATH. Deploy dibatalkan agar konfigurasi produksi tidak tertimpa." }
          php artisan optimize:clear
          php artisan migrate --force
          # Symlink/junction untuk file upload bila belum ada.
          if (-not (Test-Path 'public\storage')) { php artisan storage:link }
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart
          php artisan up

      - name: Verify deployment
        shell: powershell
        run: |
          Set-Location $env:DEPLOY_PATH
          php artisan about --only=environment
          php artisan config:show app.url

          # Smoke test health endpoint untuk memastikan aplikasi benar-benar melayani request.
          $baseUrl = (php artisan tinker --execute "echo config('app.url');" | Select-Object -Last 1).Trim().TrimEnd('/')
          if (-not $baseUrl) { throw "Tidak dapat membaca config app.url untuk smoke test." }

          $healthUrl = "$baseUrl/up"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try {
              $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 30
          } catch {
              throw "Smoke test gagal: endpoint $healthUrl tidak merespons. Detail: $($_.Exception.Message)"
          }

          if ($response.StatusCode -ne 200) {
              throw "Smoke test gagal: endpoint $healthUrl mengembalikan status $($response.StatusCode)."
          }

          Write-Host "Smoke test berhasil: $healthUrl mengembalikan 200."

      - name: Rollback on failure
        if: failure()
        shell: powershell
        run: |
          if (-not $env:BACKUP_PATH) {
              Write-Host "Tidak ada BACKUP_PATH pada environment; rollback dilewati."
              exit 0
          }

          if (-not (Test-Path $env:BACKUP_PATH)) {
              throw "Backup $env:BACKUP_PATH tidak ditemukan. Rollback manual diperlukan."
          }

          Write-Host "Rollback produksi dari: $env:BACKUP_PATH"
          # Pulihkan artefak penuh (termasuk vendor, public\build, bootstrap\cache) dari backup tanpa menyentuh .env, storage, atau public\storage.
          $backupPath = $env:BACKUP_PATH.TrimEnd('\')
          $deployPath = $env:DEPLOY_PATH.TrimEnd('\')
          $rollbackExcludes = @(
              (Join-Path $backupPath 'storage'),
              (Join-Path $deployPath 'storage'),
              (Join-Path $backupPath 'public\storage'),
              (Join-Path $deployPath 'public\storage'),
              'node_modules',
              '.git'
          )
          robocopy $backupPath $deployPath /MIR /XJ /XD $rollbackExcludes /XF '.env' 'kepegawaian_db' '*.sqlite' '*.sqlite3' /R:2 /W:2 /NP /NFL /NDL
          if ($LASTEXITCODE -ge 8) { throw "Rollback gagal (robocopy exit code $LASTEXITCODE)." }
          $LASTEXITCODE = 0

          Set-Location $env:DEPLOY_PATH
          if (Test-Path 'vendor') {
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              php artisan queue:restart
              php artisan up
          }

          Write-Host "Rollback selesai. Produksi kembali ke rilis sebelumnya."
